# Build the students' site on GitHub and deploy it to GitHub Pages.
#
# scripts/publish_pages.sh builds the two script PDFs (open fonts only; the
# commercial print fonts never leave TJO's machine) and the lecture pages, and
# assembles build/pages/. Runs on every push to master that touches the notes
# or the site, and on request.
#
# What keeps it fast: TeX Live comes from a cache of the files its apt
# packages install, the lecture figures (two minutes of TikZ) and the demo bundles are
# cached by content hash, and nothing of the parked course in dev/ is built.
name: pages

on:
  push:
    branches: [master]
    paths:
      - 'latex/**'
      - 'web/**'
      - 'scripts/**'
      - 'build.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # TeX Live from apt takes minutes to unpack and configure. On a miss it is
      # installed and every file the new packages own, plus the generated TeX
      # configuration, is packed into one archive; on a hit that archive is
      # unpacked over the runner image instead.
      - name: TeX cache
        id: tex
        uses: actions/cache@v4
        with:
          path: ~/tex-cache.tar.zst
          key: tex-apt-ubuntu-24.04-v1

      - name: TeX Live and poppler from apt (cache miss)
        if: steps.tex.outputs.cache-hit != 'true'
        run: |
          dpkg-query -W -f='${Package}\n' | sort > /tmp/before
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-pictures \
            texlive-science texlive-fonts-extra texlive-fonts-extra-links \
            texlive-lang-german texlive-plain-generic preview-latex-style poppler-utils fontconfig
          dpkg-query -W -f='${Package}\n' | sort > /tmp/after
          comm -13 /tmp/before /tmp/after > /tmp/new
          echo "$(wc -l < /tmp/new) new packages"
          { xargs -a /tmp/new dpkg -L; sudo find /var/lib/texmf /etc/texmf /var/lib/tex-common; } | sort -u > /tmp/files
          sudo tar --zstd --no-recursion -P -cf "$HOME/tex-cache.tar.zst" -T /tmp/files
          sudo chown "$USER" "$HOME/tex-cache.tar.zst"
          ls -lh "$HOME/tex-cache.tar.zst"

      - name: TeX Live and poppler from the cache
        if: steps.tex.outputs.cache-hit == 'true'
        run: |
          sudo tar --zstd -P -xf "$HOME/tex-cache.tar.zst"
          sudo ldconfig
          rm "$HOME/tex-cache.tar.zst"

      - name: Iosevka cache (the monospace face; OFL)
        id: iosevka
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts/iosevka
          key: iosevka-34.9.0

      - name: Iosevka download
        if: steps.iosevka.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /tmp/iosevka.zip \
            https://github.com/be5invis/Iosevka/releases/download/v34.9.0/PkgTTC-SGr-Iosevka-34.9.0.zip
          mkdir -p ~/.local/share/fonts/iosevka
          unzip -q -o /tmp/iosevka.zip -d ~/.local/share/fonts/iosevka

      - name: Fonts and TeX file database
        run: |
          sudo mktexlsr > /dev/null
          fc-cache -f
          fc-list | grep -c Iosevka
          xelatex --version | head -1
          kpsewhich STIXTwoText-Regular.otf tcolorbox.sty comment.sty varwidth.sty preview.sty

      - name: Figure cache
        uses: actions/cache@v4
        with:
          path: build/figures
          key: figures-${{ hashFiles('latex/figures/**', 'latex/tpc-*', 'latex/tokens/**', 'scripts/build_figures.py') }}
          restore-keys: figures-

      - name: Demo bundle cache
        uses: actions/cache@v4
        with:
          path: |
            build/site/assets/demos
            build/site/assets/site.js
            build/site/assets/site.js.sha256
            build/site/assets/site.css
          key: bundles-${{ hashFiles('web/src/**', 'web/vendor/**', 'web/package-lock.json') }}

      - name: npm ci
        run: cd web && npm ci --no-audit --no-fund

      - name: Build and assemble
        run: scripts/publish_pages.sh

      - name: What was built
        run: |
          cat build/pages/VERSION
          du -sh build/pages build/pages/pdf build/pages/web
          for f in build/pages/pdf/*.pdf; do echo "$f: $(pdfinfo "$f" | awk '/^Pages/{print $2}') pages"; done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    # only master is published; a run on another branch is a dry run of the build
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
